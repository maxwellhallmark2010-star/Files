<title>Momentum Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: an engineer's graph-paper bench seen in 3D. The scene is the page; instruments clip to its edges like a lab notebook's margins. */
:root{
  --paper:#eef1ec; --grid:rgba(40,80,120,.12); --grid-strong:rgba(40,80,120,.32);
  --ink:#1d2329; --ink-soft:#5b6670; --panel:rgba(255,255,255,.93); --panel-line:rgba(29,35,41,.12); --chip:#e3e8e3;
  --signal:#e2551b; --pe:#2f6fd6; --bench:#f7f8f4; --bench-side:#c9cfc6;
  --disp:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141b20; --grid:rgba(190,220,240,.09); --grid-strong:rgba(190,220,240,.24);
  --ink:#e6edf1; --ink-soft:#97a6b1; --panel:rgba(24,32,39,.94); --panel-line:rgba(230,237,241,.12); --chip:#25313a;
  --signal:#ff7a3d; --pe:#6ea6ff; --bench:#1d262d; --bench-side:#2c3842; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141b20; --grid:rgba(190,220,240,.09); --grid-strong:rgba(190,220,240,.24);
  --ink:#e6edf1; --ink-soft:#97a6b1; --panel:rgba(24,32,39,.94); --panel-line:rgba(230,237,241,.12); --chip:#25313a;
  --signal:#ff7a3d; --pe:#6ea6ff; --bench:#1d262d; --bench-side:#2c3842; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font:500 14px/1.4 var(--body);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.busy{cursor:grabbing}
.card{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;box-shadow:0 8px 28px rgba(10,20,30,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lbl{font:700 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.num{font:700 13px var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 9px}
.brand svg{width:26px;height:26px;flex:0 0 auto}
.brand h1{margin:0;font:800 18px/1 var(--disp);letter-spacing:-.01em;white-space:nowrap}
.sel{position:relative;display:flex;align-items:center}
.sel select{appearance:none;-webkit-appearance:none;border:0;background:var(--chip);border-radius:9px;padding:6px 28px 6px 10px;font-weight:700;font-size:13px;cursor:pointer}
.sel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink-soft);border-bottom:2px solid var(--ink-soft);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ctrls{display:flex;gap:4px;padding:5px}
.ib{width:38px;height:38px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center}
.ib:hover{background:var(--chip)}
.ib svg{width:19px;height:19px}
.ib.on{background:var(--ink);color:var(--paper)}
#speedBtn{width:auto;padding:0 10px;font:700 13px var(--mono)}

#readout{position:fixed;z-index:9;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 68px);display:flex;gap:14px;align-items:baseline;padding:7px 12px;flex-wrap:wrap;max-width:calc(100% - 32px)}
#readout span{display:flex;gap:6px;align-items:baseline;white-space:nowrap}
#readout i{font-style:normal}
.ke{color:var(--signal)}.pe{color:var(--pe)}

.xbtn{width:30px;height:30px;flex:0 0 auto;border:0;border-radius:8px;background:var(--chip);display:grid;place-items:center}
.xbtn svg{width:14px;height:14px}
.xbtn:hover{background:var(--ink);color:var(--paper)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
#world{position:fixed;z-index:11;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 68px);width:280px;max-height:calc(100% - 230px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
#world h2{margin:0;font:800 16px var(--disp)}
.grp{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grp input[type=range]{width:100%;accent-color:var(--signal)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--panel-line);background:var(--chip);border-radius:999px;padding:5px 10px;font-weight:600;font-size:12.5px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
.tog input{width:18px;height:18px;accent-color:var(--signal)}
#graph{width:100%;height:84px;display:block;border-radius:8px;background:var(--chip)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-soft)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

#inspect{position:fixed;z-index:11;left:max(16px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 112px);width:236px;padding:12px;display:flex;flex-direction:column;gap:8px}
#inspect h3{margin:0;font:800 15px var(--disp);display:flex;align-items:center;gap:8px;min-width:0}
#inspect h3 i{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--ink);flex:0 0 auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.kv .num{text-align:right}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{border:1px solid var(--panel-line);background:var(--chip);border-radius:9px;padding:7px 8px;font-weight:700;font-size:12.5px}
.btn.warn{color:var(--signal)}

#dock{position:fixed;z-index:12;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#dock>*{pointer-events:auto;max-width:100%}
#hint{pointer-events:none!important;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--panel);border:1px solid var(--panel-line);border-radius:999px;padding:5px 12px;text-align:center;max-width:min(100%,560px)}
#opts{display:flex;gap:8px;align-items:center;padding:6px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
#opts::-webkit-scrollbar,#tools::-webkit-scrollbar{display:none}
.mat{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:9px;padding:5px 9px;font-weight:700;font-size:12.5px;white-space:nowrap}
.mat i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink)}
.mat.on{background:var(--chip);border-color:var(--panel-line)}
.sep{width:1px;align-self:stretch;background:var(--panel-line);flex:0 0 auto}
.seg{display:flex;gap:2px;background:var(--chip);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:4px 9px;font-weight:700;font-size:12px}
.seg button.on{background:var(--ink);color:var(--paper)}
#tools{display:flex;gap:2px;padding:5px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.tool{flex:0 0 auto;width:62px;height:56px;border:0;border-radius:11px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:11px}
.tool svg{width:22px;height:22px}
.tool:hover{background:var(--chip)}
.tool.on{background:var(--ink);color:var(--paper)}
@media (max-width:720px){
  #world{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);max-height:46%}
  #readout{top:calc(env(safe-area-inset-top,0px) + 112px);gap:10px;font-size:12px}
  #inspect{top:calc(env(safe-area-inset-top,0px) + 150px)}
  .brand h1{font-size:16px}
}
</style>

<canvas id="cv" aria-label="3D physics simulation"></canvas>

<header id="top">
  <div class="brand card">
    <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3h20"/><path d="M13 3l6 13"/><circle cx="19.6" cy="18.6" r="3.6" fill="var(--signal)" stroke="var(--ink)"/><path d="M13 3v12" stroke-dasharray="1.5 2.5" opacity=".5"/></svg>
    <h1>Momentum Lab</h1>
    <label class="sel" for="scene"><select id="scene" aria-label="Scene">
      <option value="bench">Bench demo</option><option value="cradle">Newton's cradle</option><option value="pyramid">Pyramid</option>
      <option value="dominoes">Domino spiral</option><option value="chain">Hanging chain</option><option value="bowling">Bowling lane</option>
      <option value="wreck">Wrecking ball</option><option value="empty">Empty bench</option>
    </select></label>
  </div>
  <div class="ctrls card">
    <button class="ib" id="playBtn" aria-label="Pause"><svg id="playIco" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="ib" id="stepBtn" aria-label="Step one frame" title="Step one frame"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7z"/><rect x="16" y="5" width="3" height="14" rx="1"/></svg></button>
    <button class="ib" id="speedBtn" aria-label="Simulation speed" title="Simulation speed">1×</button>
    <button class="ib" id="viewBtn" aria-label="Reset camera" title="Reset camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V4h4M21 8V4h-4M3 16v4h4M21 16v4h-4"/><circle cx="12" cy="12" r="3.2"/></svg></button>
    <button class="ib" id="resetBtn" aria-label="Reset scene" title="Reset scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    <button class="ib" id="worldBtn" aria-label="World settings" title="World settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg></button>
  </div>
</header>

<div id="readout" class="card">
  <span><i class="lbl">Bodies</i><b class="num" id="rBodies">0</b></span>
  <span><i class="lbl">g</i><b class="num" id="rG">9.81 m/s²</b></span>
  <span><i class="lbl ke">KE</i><b class="num" id="rKE">0 J</b></span>
  <span><i class="lbl pe">PE</i><b class="num" id="rPE">0 J</b></span>
</div>

<aside id="world" class="card" aria-label="World settings">
  <div class="phead"><h2>World</h2><button class="xbtn" id="worldClose" aria-label="Close world settings" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="grp">
    <div class="row"><span class="lbl">Gravity</span><b class="num" id="gVal">9.81 m/s²</b></div>
    <input type="range" id="gSlider" min="0" max="25" step="0.01" aria-label="Gravity">
    <div class="chips" id="gChips"></div>
  </div>
  <div class="grp">
    <div class="row"><span class="lbl">Air drag</span><b class="num" id="airVal">low</b></div>
    <input type="range" id="airSlider" min="0" max="1.5" step="0.01" aria-label="Air drag">
  </div>
  <div class="grp">
    <label class="tog" for="tVec">Velocity arrows<input type="checkbox" id="tVec"></label>
    <label class="tog" for="tTrail">Motion trails<input type="checkbox" id="tTrail"></label>
    <label class="tog" for="tShadow">Shadows<input type="checkbox" id="tShadow"></label>
    <label class="tog" for="tSnd">Impact sound<input type="checkbox" id="tSnd"></label>
  </div>
  <div class="grp">
    <div class="row"><span class="lbl">Energy, last 10 s</span><b class="num" id="eTot">0 J</b></div>
    <canvas id="graph" aria-label="Kinetic and potential energy over the last ten seconds"></canvas>
    <div class="legend"><span><b style="background:var(--signal)"></b>Kinetic</span><span><b style="background:var(--pe)"></b>Potential</span></div>
  </div>
</aside>

<div id="inspect" class="card" hidden>
  <div class="phead"><h3><i id="iSw"></i><span id="iName">Body</span></h3><button class="xbtn" id="iClose" aria-label="Close readout" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="kv">
    <span class="lbl">Mass</span><b class="num" id="iMass">0</b>
    <span class="lbl">Speed</span><b class="num" id="iSpd">0</b>
    <span class="lbl">Spin</span><b class="num" id="iSpin">0</b>
    <span class="lbl">Height</span><b class="num" id="iH">0</b>
    <span class="lbl">Kinetic</span><b class="num ke" id="iKE">0</b>
    <span class="lbl">Potential</span><b class="num pe" id="iPE">0</b>
  </div>
  <div class="btns"><button class="btn" id="iFreeze">Freeze</button><button class="btn warn" id="iDel">Delete</button></div>
</div>

<div id="dock">
  <div id="hint"></div>
  <div id="opts" class="card" hidden></div>
  <nav id="tools" class="card" aria-label="Tools"></nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/oimo@1.0.9/build/oimo.min.js"></script>
<script>
'use strict';
const $=function(id){return document.getElementById(id);};
const clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
const V3=THREE.Vector3;
const STEP=1/120;                 /* physics step in seconds; units are metres, kilograms, seconds */
const BENCH=12;                   /* half-size of the bench top in metres */

/* ---------- settings ---------- */
const S={g:9.81,air:0.05,speed:1,vec:false,trail:false,shadow:true,sound:true,paused:false,tool:'grab',mat:'wood',size:1,scene:'bench'};
try{Object.assign(S,JSON.parse(localStorage.getItem('momentumlab3d.v1')||'{}'));}catch(e){}
S.paused=false;S.tool='grab';
function save(){try{localStorage.setItem('momentumlab3d.v1',JSON.stringify({g:S.g,air:S.air,vec:S.vec,trail:S.trail,shadow:S.shadow,sound:S.sound,mat:S.mat,size:S.size,scene:S.scene}));}catch(e){}}

const MATS={
  wood:{name:'Wood',rho:700,friction:0.55,restitution:0.25,color:'#c98b4b'},
  steel:{name:'Steel',rho:7850,friction:0.3,restitution:0.2,color:'#a7b1bb'},
  rubber:{name:'Rubber',rho:1100,friction:0.95,restitution:0.85,color:'#e14b3b'},
  ice:{name:'Ice',rho:917,friction:0.02,restitution:0.05,color:'#a9dcf0'}
};
const GRAV=[{n:'Zero-g',g:0},{n:'Moon',g:1.62},{n:'Mars',g:3.71},{n:'Earth',g:9.81},{n:'Jupiter',g:24.79}];

/* ---------- physics world ---------- */
const world=new OIMO.World({timestep:STEP,iterations:10,broadphase:2,worldscale:1,random:false,info:false,gravity:[0,-S.g,0]});
world.add({type:'box',size:[BENCH*2,1,BENCH*2],pos:[0,-0.5,0],move:false,friction:0.6,restitution:0.2});
function applyGravity(){world.setGravity([0,-S.g,0]);ENTS.forEach(function(e){if(!e.frozen)e.body.awake();});}

/* ---------- renderer + scene ---------- */
const cv=$('cv');let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});}catch(err){$('hint').textContent='This browser could not start 3D graphics. Try a recent Chrome, Safari or Firefox.';throw err;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=S.shadow;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.05,300);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a9890,0.55));
const sun=new THREE.DirectionalLight(0xffffff,0.95);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
(function(){const c=sun.shadow.camera;c.left=-8;c.right=8;c.top=8;c.bottom=-8;c.near=0.5;c.far=60;})();
sun.shadow.bias=-0.0003;sun.shadow.normalBias=0.02;scene.add(sun);scene.add(sun.target);
/* studio environment for metal and ice reflections */
(function(){
  const env=new THREE.Scene(),sg=new THREE.SphereGeometry(20,24,12),p=sg.attributes.position,cols=[];
  for(let i=0;i<p.count;i++){const h=p.getY(i)/20;const c=new THREE.Color(0.9,0.93,0.95).lerp(h>0?new THREE.Color(1.25,1.25,1.3):new THREE.Color(0.35,0.37,0.36),Math.abs(h));cols.push(c.r,c.g,c.b);}
  sg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));env.add(new THREE.Mesh(sg,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide})));
  [[8,10,6,5],[-9,6,-4,2.4]].forEach(function(l){const m=new THREE.Mesh(new THREE.PlaneGeometry(6,3),new THREE.MeshBasicMaterial({color:new THREE.Color(l[3],l[3],l[3])}));m.position.set(l[0],l[1],l[2]);m.lookAt(0,0,0);env.add(m);});
  scene.environment=new THREE.PMREMGenerator(renderer).fromScene(env,0.02).texture;
})();
let THEME={};
const gcv=$('graph'),gctx=gcv.getContext('2d');
const benchTexCanvas=document.createElement('canvas');benchTexCanvas.width=benchTexCanvas.height=2048;
const benchTex=new THREE.CanvasTexture(benchTexCanvas);benchTex.anisotropy=renderer.capabilities.getMaxAnisotropy();
const benchTop=new THREE.MeshStandardMaterial({map:benchTex,roughness:0.92,metalness:0});
const benchSide=new THREE.MeshStandardMaterial({color:0xc9cfc6,roughness:0.9});
const benchMesh=new THREE.Mesh(new THREE.BoxGeometry(BENCH*2,0.4,BENCH*2),[benchSide,benchSide,benchTop,benchSide,benchSide,benchSide]);
benchMesh.position.y=-0.2;benchMesh.receiveShadow=true;scene.add(benchMesh);
function drawBench(){
  /* graph paper: 10 cm minor squares, 1 m major lines, metre numbers along the two axes */
  const c=benchTexCanvas.getContext('2d'),N=2048,ppm=N/(BENCH*2);
  c.fillStyle=THEME.bench;c.fillRect(0,0,N,N);
  for(let pass=0;pass<2;pass++){
    c.strokeStyle=pass?THEME['grid-strong']:THEME.grid;c.lineWidth=pass?2:1;c.beginPath();
    const step=pass?ppm:ppm/10;for(let x=0;x<=N+1;x+=step){c.moveTo(x,0);c.lineTo(x,N);c.moveTo(0,x);c.lineTo(N,x);}c.stroke();
  }
  c.strokeStyle=THEME.signal;c.lineWidth=3;c.beginPath();c.moveTo(0,N/2);c.lineTo(N,N/2);c.moveTo(N/2,0);c.lineTo(N/2,N);c.stroke();
  c.fillStyle=THEME['ink-soft'];c.font='600 18px '+THEME.mono;c.textBaseline='top';
  for(let m=-BENCH+1;m<BENCH;m++){if(m===0)continue;const p=N/2+m*ppm;c.fillText(m+' m',p+4,N/2+5);c.fillText(-m+' m',N/2+5,p+4);}
  benchTex.needsUpdate=true;
}
let MAT_SEL=null,LINE_MAT=null,ANCHOR_MAT=null;
function readTheme(){
  const cs=getComputedStyle(document.documentElement);
  ['paper','grid','grid-strong','ink','ink-soft','signal','pe','chip','bench','bench-side'].forEach(function(k){THEME[k]=cs.getPropertyValue('--'+k).trim();});
  THEME.mono=cs.getPropertyValue('--mono').trim();
  scene.background=new THREE.Color(THEME.paper);scene.fog=new THREE.Fog(THEME.paper,22,60);
  benchSide.color.set(THEME['bench-side']);drawBench();
  if(MAT_SEL){MAT_SEL.color.set(THEME.signal);LINE_MAT.color.set(THEME.ink);ANCHOR_MAT.color.set(THEME.ink);}
}

/* ---------- materials for drawing ---------- */
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const WOOD_TEX=tex(256,256,function(g,w,h){g.fillStyle='#c98b4b';g.fillRect(0,0,w,h);g.strokeStyle='rgba(110,60,20,.3)';g.lineWidth=2;
  for(let y=6;y<h;y+=11){g.beginPath();g.moveTo(0,y);for(let x=0;x<=w;x+=16)g.lineTo(x,y+Math.sin((x+y*3)*0.06)*3);g.stroke();}});
const RUB_TEX=tex(64,64,function(g,w,h){g.fillStyle='#e14b3b';g.fillRect(0,0,w,h);for(let i=0;i<120;i++){g.fillStyle='rgba(0,0,0,'+(Math.random()*0.1)+')';g.fillRect(Math.random()*w,Math.random()*h,2,2);}});
const RMAT={
  wood:new THREE.MeshStandardMaterial({map:WOOD_TEX,roughness:0.72,metalness:0}),
  steel:new THREE.MeshStandardMaterial({color:0xc4ccd4,roughness:0.28,metalness:0.92}),
  rubber:new THREE.MeshStandardMaterial({map:RUB_TEX,roughness:0.85,metalness:0}),
  ice:new THREE.MeshPhysicalMaterial({color:0xbfe6f5,roughness:0.06,metalness:0,clearcoat:1,transparent:true,opacity:0.7})
};
const FROZEN={};Object.keys(RMAT).forEach(function(k){FROZEN[k]=RMAT[k].clone();FROZEN[k].emissive=new THREE.Color(0x2f6fd6);FROZEN[k].emissiveIntensity=0.25;});
MAT_SEL=new THREE.MeshBasicMaterial({color:0xe2551b,side:THREE.BackSide});
LINE_MAT=new THREE.MeshStandardMaterial({color:0x1d2329,roughness:0.5,metalness:0.3});
ANCHOR_MAT=new THREE.MeshStandardMaterial({color:0x1d2329,roughness:0.4,metalness:0.5});
const SPRING_MAT=new THREE.LineBasicMaterial({color:0x1d2329});
readTheme();

/* ---------- bodies ---------- */
const ENTS=[],LINKS=[],DECOR=new THREE.Group();scene.add(DECOR);
const _q=new THREE.Quaternion(),_v=new V3(),_w=new V3();
function bodyPos(e){return _v.set(e.body.position.x,e.body.position.y,e.body.position.z);}
function bodyQuat(e,q){const o=e.body.getQuaternion();return (q||_q).set(o.x,o.y,o.z,o.w);}
function toWorld(e,local,out){return (out||new V3()).copy(local).applyQuaternion(bodyQuat(e)).add(bodyPos(e));}
function toLocal(e,p){return new V3().copy(p).sub(bodyPos(e)).applyQuaternion(bodyQuat(e).invert());}
/* spec: {kind:'ball'|'box'|'cyl', size:[...], mat, pos:[x,y,z], rot:[deg x,y,z], frozen, phys:{} overrides} */
function spawn(spec){
  const m=MATS[spec.mat],s=spec.size,kind=spec.kind;let geo,type,vol,name;
  if(kind==='ball'){geo=new THREE.SphereGeometry(s[0],32,20);type='sphere';vol=4/3*Math.PI*s[0]**3;name='ball';}
  else if(kind==='cyl'){geo=new THREE.CylinderGeometry(s[0],s[0],s[1],28);type='cylinder';vol=Math.PI*s[0]*s[0]*s[1];name='cylinder';}
  else{geo=new THREE.BoxGeometry(s[0],s[1],s[2]);type='box';vol=s[0]*s[1]*s[2];const mx=Math.max.apply(null,s),mn=Math.min.apply(null,s);name=mx/mn>4?(s[1]===mx?'domino':'plank'):'box';}
  const cfg=Object.assign({type:type,size:s,pos:spec.pos,rot:spec.rot||[0,0,0],move:true,density:m.rho,friction:m.friction,restitution:m.restitution},spec.phys||{});
  const body=world.add(cfg);
  const mesh=new THREE.Mesh(geo,RMAT[spec.mat]);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
  const rho=(spec.phys&&spec.phys.density)||m.rho;
  const e={kind:kind,size:s,mat:spec.mat,body:body,mesh:mesh,vol:vol,mass:vol*rho,name:spec.name||name,frozen:false,trail:null,arrow:null};
  mesh.userData.ent=e;ENTS.push(e);
  if(spec.frozen)setFrozen(e,true);
  if(spec.vel)body.linearVelocity.set(spec.vel[0],spec.vel[1],spec.vel[2]);
  if(spec.spin)body.angularVelocity.set(spec.spin[0],spec.spin[1],spec.spin[2]);
  syncMesh(e);return e;
}
function setFrozen(e,on){
  if(on===e.frozen)return;e.frozen=on;
  e.body.setupMass(on?OIMO.BODY_STATIC:OIMO.BODY_DYNAMIC);
  if(on){e.body.linearVelocity.set(0,0,0);e.body.angularVelocity.set(0,0,0);}else e.body.awake();
  e.mesh.material=on?FROZEN[e.mat]:RMAT[e.mat];
}
function syncMesh(e){const p=e.body.position,q=e.body.getQuaternion();e.mesh.position.set(p.x,p.y,p.z);e.mesh.quaternion.set(q.x,q.y,q.z,q.w);}
function removeEnt(e){
  LINKS.slice().forEach(function(l){if(l.a===e||l.b===e)removeLink(l);});
  world.removeRigidBody(e.body);scene.remove(e.mesh);e.mesh.geometry.dispose();
  if(e.trail)scene.remove(e.trail);if(e.arrow)scene.remove(e.arrow);
  ENTS.splice(ENTS.indexOf(e),1);if(SEL===e)select(null);
  if(grab&&grab.e===e)endGrab();if(pending&&pending.e===e){pending=null;buildDock();}
}
/* a fixed point in space that springs, rods and pins can hang from */
function anchorBody(p){return world.add({type:'sphere',size:[0.01],pos:[p.x,p.y,p.z],move:false,belongsTo:0,collidesWith:0});}
function addLink(kind,a,la,b,lb,opts){
  /* a is always a body; b is a body, or null for a fixed point (then lb is that world point) */
  const l={kind:kind,a:a,la:la.clone(),b:b,lb:lb.clone(),anchor:null,joint:null,mesh:null};
  const pa=toWorld(a,la),pb=b?toWorld(b,lb):lb.clone();
  l.rest=(opts&&opts.rest!==undefined)?opts.rest:pa.distanceTo(pb);
  if(!b){l.anchor=anchorBody(lb);const am=new THREE.Mesh(new THREE.SphereGeometry(0.05,16,10),ANCHOR_MAT);am.position.copy(lb);am.castShadow=true;scene.add(am);l.amesh=am;}
  const other=b?b.body:l.anchor,lo=b?[lb.x,lb.y,lb.z]:[0,0,0];
  if(kind==='rod')l.joint=world.add({type:'jointDistance',body1:a.body,body2:other,pos1:[la.x,la.y,la.z],pos2:lo,min:l.rest,max:l.rest,collision:true});
  else if(kind==='pin')l.joint=world.add({type:'jointBall',body1:a.body,body2:other,pos1:[la.x,la.y,la.z],pos2:lo,collision:false});
  else{l.k=(opts&&opts.k)||Math.max(40,60*a.mass);l.c=2*Math.sqrt(l.k*a.mass)*0.06;}
  if(kind==='spring'){l.mesh=new THREE.Line(new THREE.BufferGeometry(),SPRING_MAT.clone());l.mesh.geometry.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(3*130),3));l.mesh.frustumCulled=false;}
  else if(kind==='rod'){l.mesh=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.018,1,10),LINE_MAT);l.mesh.castShadow=true;}
  else{l.mesh=new THREE.Mesh(new THREE.ConeGeometry(0.05,0.16,14),new THREE.MeshStandardMaterial({color:0xe2551b,roughness:0.4}));l.mesh.castShadow=true;}
  l.mesh.userData.link=l;scene.add(l.mesh);
  a.body.awake();if(b)b.body.awake();
  LINKS.push(l);return l;
}
function removeLink(l){
  if(l.joint)world.removeJoint(l.joint);if(l.anchor)world.removeRigidBody(l.anchor);
  scene.remove(l.mesh);if(l.amesh)scene.remove(l.amesh);LINKS.splice(LINKS.indexOf(l),1);
  if(!l.a.frozen)l.a.body.awake();if(l.b&&!l.b.frozen)l.b.body.awake();
}
function linkEnds(l){return [toWorld(l.a,l.la),l.b?toWorld(l.b,l.lb):l.lb.clone()];}
const _d=new V3();
function velAt(e,p,out){const b=e.body,w=b.angularVelocity;_w.set(w.x,w.y,w.z);const r=new V3().copy(p).sub(bodyPos(e));return out.copy(_w.cross(r)).add(new V3(b.linearVelocity.x,b.linearVelocity.y,b.linearVelocity.z));}
/* Hooke springs with damping, applied as impulses every step */
function applySprings(dt){
  LINKS.forEach(function(l){
    if(l.kind!=='spring')return;
    const e=linkEnds(l),pa=e[0],pb=e[1];_d.subVectors(pb,pa);const len=_d.length();if(len<1e-6)return;_d.multiplyScalar(1/len);
    const va=l.a.frozen?new V3():velAt(l.a,pa,new V3()),vb=l.b&&!l.b.frozen?velAt(l.b,pb,new V3()):new V3();
    const f=l.k*(len-l.rest)+l.c*_d.dot(vb.sub(va));
    const J=_d.clone().multiplyScalar(f*dt);
    if(!l.a.frozen)l.a.body.applyImpulse(new OIMO.Vec3(pa.x,pa.y,pa.z),new OIMO.Vec3(J.x,J.y,J.z));
    if(l.b&&!l.b.frozen)l.b.body.applyImpulse(new OIMO.Vec3(pb.x,pb.y,pb.z),new OIMO.Vec3(-J.x,-J.y,-J.z));
    if(Math.abs(f)>0.5){if(!l.a.frozen)l.a.body.awake();if(l.b&&!l.b.frozen)l.b.body.awake();}
  });
}
function clearWorld(){
  LINKS.slice().forEach(removeLink);ENTS.slice().forEach(removeEnt);
  while(DECOR.children.length)DECOR.remove(DECOR.children[0]);
  select(null);grab=null;pending=null;
}

/* ---------- camera ---------- */
const CAM={tx:0,ty:0.8,tz:0,yaw:0.7,pitch:0.42,dist:9};
let CAM_HOME=Object.assign({},CAM);
function placeCam(){
  const cp=Math.cos(CAM.pitch);
  camera.position.set(CAM.tx+Math.sin(CAM.yaw)*cp*CAM.dist,CAM.ty+Math.sin(CAM.pitch)*CAM.dist,CAM.tz+Math.cos(CAM.yaw)*cp*CAM.dist);
  camera.lookAt(CAM.tx,CAM.ty,CAM.tz);
  sun.target.position.set(CAM.tx,0,CAM.tz);sun.position.set(CAM.tx+6,14,CAM.tz+8);
}
function setCam(c){Object.assign(CAM,c);CAM_HOME=Object.assign({},CAM);placeCam();}

/* ---------- measurements (SI) ---------- */
function measure(e){
  const b=e.body,v=b.linearVelocity,w=b.angularVelocity,m=e.mass,s=e.size;
  const spd=Math.hypot(v.x,v.y,v.z),om=Math.hypot(w.x,w.y,w.z);
  const I=e.kind==='ball'?0.4*m*s[0]*s[0]:e.kind==='cyl'?m*(3*s[0]*s[0]+s[1]*s[1])/12:m*(s[0]*s[0]+s[1]*s[1]+s[2]*s[2])/18;
  const h=Math.max(0,b.position.y);
  return {m:m,spd:e.frozen?0:spd,omega:e.frozen?0:om,ke:e.frozen?0:0.5*m*spd*spd+0.5*I*om*om,pe:m*S.g*h,h:h};
}

/* ---------- audio ---------- */
let AC=null,lastClick=0,acted=false;
['pointerdown','keydown'].forEach(function(ev){window.addEventListener(ev,function(){acted=true;},{capture:true});});
function knock(mat,vol){
  if(!S.sound||!acted||vol<0.03)return;const now=performance.now();if(now-lastClick<30)return;lastClick=now;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const f={wood:420,steel:1800,rubber:160,ice:2600}[mat]||500,dur={wood:0.06,steel:0.22,rubber:0.08,ice:0.05}[mat]||0.08;
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=mat==='steel'?'triangle':'sine';
    o.frequency.setValueAtTime(f*(0.9+Math.random()*0.2),t);o.frequency.exponentialRampToValueAtTime(f*0.6,t+dur);
    g.gain.setValueAtTime(Math.min(0.22,vol),t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}
}
/* impacts: a sudden drop in speed means the body just hit something */
function listenImpacts(){
  ENTS.forEach(function(e){
    if(e.frozen)return;const v=e.body.linearVelocity,sp=Math.hypot(v.x,v.y,v.z);
    if(e.lastSp!==undefined&&e.lastSp-sp>0.8)knock(e.mat,(e.lastSp-sp)*0.03);e.lastSp=sp;
  });
}

  if(gcv.width!==Math.round(w*DPR)){gcv.width=Math.round(w*DPR);gcv.height=Math.round(h*DPR);}
  gctx.setTransform(DPR,0,0,DPR,0,0);gctx.clearRect(0,0,w,h);
  gctx.strokeStyle=THEME.grid;gctx.lineWidth=1;gctx.beginPath();for(let i=1;i<4;i++){gctx.moveTo(0,h*i/4);gctx.lineTo(w,h*i/4);}gctx.stroke();
  if(hist.length<2)return;
  let max=1;hist.forEach(function(s){max=Math.max(max,s.ke+s.pe);});
  const X=function(i){return i/99*w;},Y=function(v){return h-4-v/max*(h-10);},off=100-hist.length;
  gctx.beginPath();gctx.moveTo(X(off),Y(0));hist.forEach(function(s,i){gctx.lineTo(X(off+i),Y(s.pe));});gctx.lineTo(X(99),Y(0));gctx.closePath();gctx.fillStyle=THEME.pe;gctx.globalAlpha=0.55;gctx.fill();
  gctx.beginPath();hist.forEach(function(s,i){gctx[i?'lineTo':'moveTo'](X(off+i),Y(s.pe+s.ke));});for(let i=hist.length-1;i>=0;i--)gctx.lineTo(X(off+i),Y(hist[i].pe));gctx.closePath();gctx.fillStyle=THEME.signal;gctx.globalAlpha=0.6;gctx.fill();gctx.globalAlpha=1;
  const l=hist[hist.length-1];gctx.beginPath();gctx.arc(X(99),Y(l.pe+l.ke),3,0,Math.PI*2);gctx.fillStyle=THEME.ink;gctx.fill();
}
