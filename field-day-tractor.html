<title>Field Day Tractor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed WebGL farm, HUD pinned to the safe-area corners, touch controls in the thumb zones */
:root{
  --ink:#f5f0dc;
  --ink-dim:rgba(245,240,220,.7);
  --panel:rgba(18,26,14,.74);
  --line:rgba(245,240,220,.16);
  --deere:#367c2b;
  --yellow:#ffd91a;
  --soil:#2a1d10;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-ui:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
  --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{
  margin:0;background:#0f160c;color:var(--ink);font-family:var(--f-ui);font-size:16px;
  padding-left:max(16px,var(--sl));padding-right:max(16px,var(--sr));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* top-left status */
#status{position:fixed;top:calc(12px + var(--st));left:max(14px,var(--sl));padding:8px 14px 9px;display:grid;gap:1px;pointer-events:none;z-index:5}
#mode{font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
#mode i{font-style:normal;color:var(--yellow)}
#field{font-size:15px;color:var(--ink-dim);letter-spacing:.03em;font-variant-numeric:tabular-nums}
#fieldbar{height:4px;border-radius:2px;background:rgba(245,240,220,.15);overflow:hidden;margin-top:5px;width:150px}
#fieldbar b{display:block;height:100%;width:0;background:var(--yellow);transition:width .25s}

/* top-right */
#sound{position:fixed;top:calc(12px + var(--st));right:max(14px,var(--sr));z-index:6;font:600 15px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding:9px 14px;cursor:pointer}
#sound:focus-visible,.tbtn:focus-visible,#go:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

/* speed gauge */
#gauge{position:fixed;top:calc(64px + var(--st));right:max(14px,var(--sr));width:118px;height:118px;padding:0;z-index:5;pointer-events:none;border-radius:50%}
#gauge svg{position:absolute;inset:3px;width:110px;height:110px}
#gauge .track{fill:none;stroke:rgba(245,240,220,.16);stroke-width:7;stroke-linecap:round}
#gauge .arc{fill:none;stroke:var(--yellow);stroke-width:7;stroke-linecap:round;transition:stroke-dasharray .08s linear}
#gauge .tick{stroke:rgba(245,240,220,.45);stroke-width:1.5}
.gnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:.9}
#spd{font-family:var(--f-display);font-weight:900;font-size:38px;font-variant-numeric:tabular-nums}
.gnum small{font-size:12px;letter-spacing:.12em;color:var(--ink-dim);text-transform:uppercase;margin-top:3px}
#gear{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);font:700 14px var(--f-ui);letter-spacing:.1em;color:var(--soil);background:var(--yellow);border-radius:4px;padding:0 6px}

/* centre prompts */
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1.5px rgba(0,0,0,.35);pointer-events:none;z-index:4}
#prompt{position:fixed;left:50%;bottom:calc(30% + var(--sb));transform:translateX(-50%);padding:9px 16px;font-size:18px;letter-spacing:.03em;white-space:nowrap;pointer-events:none;z-index:5}
#prompt kbd,#legend kbd{font:700 14px var(--f-ui);background:var(--yellow);color:var(--soil);border-radius:4px;padding:1px 7px;margin-right:6px}
#toast{position:fixed;left:50%;top:calc(22% + var(--st));transform:translateX(-50%);padding:10px 18px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;pointer-events:none;z-index:6;color:var(--yellow)}
#lockhint{position:fixed;left:50%;top:calc(12px + var(--st));transform:translateX(-50%);font-size:14px;color:var(--ink-dim);padding:6px 12px;pointer-events:none;z-index:5}

/* desktop key legend */
#legend{position:fixed;left:max(14px,var(--sl));bottom:calc(14px + var(--sb));padding:8px 12px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px 14px;max-width:min(760px,calc(100vw - 28px));pointer-events:none;z-index:5}
#legend span{white-space:nowrap;color:var(--ink-dim)}
#legend kbd{margin-right:4px}

/* touch controls */
#touch{position:fixed;inset:0;pointer-events:none;z-index:7}
#stickzone{position:absolute;left:0;bottom:0;width:48%;height:55%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:calc(max(22px,var(--sl)) + 6px);bottom:calc(26px + var(--sb));width:136px;height:136px;border-radius:50%;background:rgba(18,26,14,.42);border:2px solid rgba(245,240,220,.28);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,217,26,.85);box-shadow:0 3px 10px rgba(0,0,0,.35);border:2px solid rgba(42,29,16,.35)}
#tbtns{position:absolute;right:calc(max(18px,var(--sr)) + 4px);bottom:calc(26px + var(--sb));display:grid;grid-template-columns:auto auto;grid-template-areas:"cam use" "act use";gap:12px;align-items:end;pointer-events:none}
.tbtn{pointer-events:auto;touch-action:none;font:700 15px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:rgba(18,26,14,.6);border:2px solid rgba(245,240,220,.3);border-radius:50%;width:70px;height:70px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;padding:4px}
.tbtn:active,.tbtn.down{background:rgba(255,217,26,.35)}
#bUse{grid-area:use;width:92px;height:92px;font-size:17px}
#bUse.ready{background:var(--yellow);color:var(--soil);border-color:var(--yellow)}
#bUse.off{opacity:.45}
#bAct{grid-area:act}
#bCam{grid-area:cam}

#fade{position:fixed;inset:0;background:#0b1008;opacity:0;pointer-events:none;transition:opacity .18s;z-index:8}
#fade.on{opacity:1}

/* start screen */
#start{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;padding:calc(20px + var(--st)) max(16px,var(--sr)) calc(22px + var(--sb)) max(16px,var(--sl));background:linear-gradient(180deg,rgba(11,16,8,0) 25%,rgba(11,16,8,.82) 75%);overflow:auto;touch-action:pan-y}
.card{max-width:540px;width:100%;display:grid;gap:14px}
.eyebrow{font:600 14px var(--f-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--yellow)}
h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(54px,13vw,104px);line-height:.84;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;text-shadow:0 3px 22px rgba(0,0,0,.45)}
h1 span{color:var(--yellow)}
.lede{margin:0;font-size:19px;line-height:1.3;color:var(--ink);max-width:44ch;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:16px;padding:12px 14px}
.keys div{display:flex;gap:8px;align-items:baseline;min-width:0}
.keys b{font-weight:700;color:var(--yellow);white-space:nowrap;min-width:76px}
.keys span{color:var(--ink-dim)}
.keys h2{grid-column:1/-1;margin:0 0 2px;font:700 13px var(--f-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
#go{justify-self:start;font:900 24px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:12px 34px 13px;border:0;border-radius:8px;background:var(--yellow);color:var(--soil);cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.35)}
#go:active{transform:translateY(1px)}
@media (max-width:460px){.keys{grid-template-columns:1fr}.lede{font-size:17px}}
@media (prefers-reduced-motion:reduce){#fade,#fieldbar b,#gauge .arc{transition:none}}
</style>

<canvas id="c" tabindex="0" aria-label="3D farm scene"></canvas>

<div id="status" class="panel" aria-live="polite">
  <div id="mode">On foot</div>
  <div id="field">Wheat cut 0%</div>
  <div id="fieldbar"><b id="fieldfill"></b></div>
</div>
<button id="sound" class="panel" type="button">Sound on</button>

<div id="gauge" class="panel" hidden>
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <path class="track" d="M 25.4 94.6 A 49 49 0 1 1 94.6 94.6" pathLength="100"/>
    <path id="gArc" class="arc" d="M 25.4 94.6 A 49 49 0 1 1 94.6 94.6" pathLength="100" stroke-dasharray="0 100"/>
  </svg>
  <div class="gnum"><span id="spd">0</span><small>km/h</small></div>
  <div id="gear">N</div>
</div>

<div id="cross"></div>
<div id="prompt" class="panel" hidden></div>
<div id="toast" class="panel" hidden></div>
<div id="lockhint" class="panel" hidden>Click the field to steer the view with your mouse · Esc releases it</div>
<div id="legend" class="panel" hidden></div>

<div id="touch" hidden>
  <div id="stickzone"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="tbtns">
    <button id="bCam" class="tbtn" type="button">View</button>
    <button id="bAct" class="tbtn" type="button">Jump</button>
    <button id="bUse" class="tbtn off" type="button">Get in</button>
  </div>
</div>

<div id="fade"></div>

<div id="start">
  <div class="card">
    <div class="eyebrow">North field · 64 acres of wheat</div>
    <h1>Field Day <span>Tractor</span></h1>
    <p class="lede">Walk the yard, climb into the dual-wheel tractor and cut the wheat field down to stubble.</p>
    <div class="keys panel" id="keys"></div>
    <button id="go" type="button">Start</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const wrapA=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand=rng(8320);
const UP=new V3(0,1,0);
const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window && navigator.maxTouchPoints>0);

/* ---------------- renderer / scene ---------------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isTouch?1.5:2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const HORIZON=0xd6e6ea;
scene.background=new THREE.Color(HORIZON);
scene.fog=new THREE.Fog(HORIZON,90,390);
const camera=new THREE.PerspectiveCamera(70,1,0.08,1300);
camera.rotation.order='YXZ';
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?80:70;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xdcefff,0x6b7a3c,0.72));
const sun=new THREE.DirectionalLight(0xfff0d4,0.95);
const SUN_DIR=new V3(0.55,0.82,0.32).normalize();
sun.castShadow=true;
const SM=isTouch?1024:2048;
sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-42,right:42,top:42,bottom:-42,near:1,far:280});
sun.shadow.bias=-0.0005; sun.shadow.normalBias=0.04;
scene.add(sun,sun.target);
function placeSun(c){sun.position.copy(c).addScaledVector(SUN_DIR,130);sun.target.position.copy(c);}

/* sky dome, sun disc, clouds */
{
  const g=new THREE.SphereGeometry(700,32,16);
  const p=g.attributes.position, col=new Float32Array(p.count*3);
  const top=new THREE.Color(0x5f9fd6), hor=new THREE.Color(HORIZON), c=new THREE.Color();
  for(let i=0;i<p.count;i++){const t=clamp(p.getY(i)/700,0,1);c.copy(hor).lerp(top,Math.pow(t,0.55));col.set([c.r,c.g,c.b],i*3);}
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false}));
  sky.renderOrder=-2; scene.add(sky); window.__sky=sky;
  const disc=new THREE.Mesh(new THREE.SphereGeometry(16,16,8),new THREE.MeshBasicMaterial({color:0xfff6dc,fog:false}));
  disc.position.copy(SUN_DIR).multiplyScalar(640); sky.add(disc);
  const cm=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x8a95a0,flatShading:true});
  const cg=new THREE.IcosahedronGeometry(1,1);
  for(let i=0;i<16;i++){
    const cl=new THREE.Group(); const a=rand()*Math.PI*2, r=120+rand()*260;
    cl.position.set(Math.cos(a)*r,85+rand()*50,Math.sin(a)*r);
    const n=3+Math.floor(rand()*3);
    for(let k=0;k<n;k++){const m=new THREE.Mesh(cg,cm);m.scale.set(9+rand()*8,4+rand()*3,7+rand()*6);m.position.set((k-n/2)*9+rand()*4,rand()*3,rand()*6);cl.add(m);}
    scene.add(cl);
  }
}

/* ---------------- terrain ---------------- */
const FIELD={x0:24,x1:88,z0:-38,z1:38};
function fieldMask(x,z){const dx=Math.max(FIELD.x0-x,0,x-FIELD.x1),dz=Math.max(FIELD.z0-z,0,z-FIELD.z1);return 1-smoothstep(0,12,Math.hypot(dx,dz));}
function heightAt(x,z){
  const fy=smoothstep(32,54,Math.hypot(x+15,z));
  let h=2.6*Math.sin(x*0.021+0.5)*Math.cos(z*0.018)+1.2*Math.sin(x*0.05)*Math.sin(z*0.043+1.3)+0.35*Math.sin(x*0.13+z*0.11);
  h*=fy*(1-0.72*fieldMask(x,z));
  const r=Math.hypot(x,z), far=smoothstep(140,240,r);
  if(far>0){const a=Math.atan2(z,x);h+=far*far*(24+10*Math.sin(a*3+1)+6*Math.sin(a*7));}
  return h;
}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=renderer.capabilities.getMaxAnisotropy?Math.min(8,renderer.capabilities.getMaxAnisotropy()):1;return t;}
const speckle=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#ececec';g.fillRect(0,0,w,h);for(let i=0;i<1400;i++){const v=170+Math.floor(Math.random()*85);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*3);}});
{
  const G=520,SEG=208;
  const gg=new THREE.PlaneGeometry(G,G,SEG,SEG); gg.rotateX(-Math.PI/2);
  const p=gg.attributes.position, col=new Float32Array(p.count*3);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i); p.setY(i,heightAt(x,z));
    const n=0.5+0.5*Math.sin(x*0.37+Math.sin(z*0.21)*2)*Math.cos(z*0.31+Math.sin(x*0.17)*1.5);
    let r=0.32+0.07*n,gr=0.52+0.08*n,b=0.2+0.02*n;
    const inside=Math.min(x-FIELD.x0,FIELD.x1-x,z-FIELD.z0,FIELD.z1-z), s=smoothstep(-1.5,1.5,inside);
    r=lerp(r,0.46+0.05*n,s);gr=lerp(gr,0.35+0.04*n,s);b=lerp(b,0.21,s);
    const yd=smoothstep(26,12,Math.hypot(x+20,z+4))*0.7;
    r=lerp(r,0.56,yd);gr=lerp(gr,0.5,yd);b=lerp(b,0.36,yd);
    const far=smoothstep(150,230,Math.hypot(x,z));
    r=lerp(r,0.38,far);gr=lerp(gr,0.5,far);b=lerp(b,0.28,far);
    col.set([r,gr,b],i*3);
  }
  gg.setAttribute('color',new THREE.BufferAttribute(col,3)); gg.computeVertexNormals();
  speckle.repeat.set(140,140);
  const ground=new THREE.Mesh(gg,new THREE.MeshLambertMaterial({vertexColors:true,map:speckle}));
  ground.receiveShadow=true; scene.add(ground);
}
/* gravel roads as ribbons draped over the ground */
const gravel=canvasTex(64,64,(g,w,h)=>{g.fillStyle='#b49c70';g.fillRect(0,0,w,h);for(let i=0;i<500;i++){const v=Math.random();g.fillStyle=v<.5?'rgba(90,72,45,.35)':'rgba(235,225,200,.35)';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);} g.fillStyle='rgba(80,64,40,.25)';g.fillRect(14,0,6,h);g.fillRect(w-20,0,6,h);});
function road(ax,az,bx,bz,w,lift){
  const len=Math.hypot(bx-ax,bz-az),n=Math.ceil(len/2),dx=(bx-ax)/len,dz=(bz-az)/len,px=-dz,pz=dx;
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=n;i++){const t=i/n,x=ax+(bx-ax)*t,z=az+(bz-az)*t;for(const s of[-1,1]){const vx=x+px*w/2*s,vz=z+pz*w/2*s;pos.push(vx,heightAt(vx,vz)+lift,vz);uv.push(s<0?0:1,t*len/w);}}
  for(let i=0;i<n;i++){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({map:gravel,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2,side:THREE.DoubleSide}));
  m.receiveShadow=true;scene.add(m);
}
road(-14,0,22.5,0,3.6,0.06);
road(21,-44,21,44,3.6,0.08);

/* ---------------- collision world ---------------- */
const statics=[]; // {c:true,x,z,r} | {x0,x1,z0,z1}
const addBox=(x0,x1,z0,z1)=>statics.push({x0,x1,z0,z1});
const addCirc=(x,z,r)=>statics.push({c:true,x,z,r});
function resolve(p,r){
  let hit=false;
  for(const s of statics){
    if(s.c){const dx=p.x-s.x,dz=p.z-s.z,m=r+s.r;if(Math.abs(dx)>m||Math.abs(dz)>m)continue;const d=Math.hypot(dx,dz);if(d<m&&d>1e-6){const k=(m-d)/d;p.x+=dx*k;p.z+=dz*k;hit=true;}}
    else{
      if(p.x<s.x0-r||p.x>s.x1+r||p.z<s.z0-r||p.z>s.z1+r)continue;
      const cx=clamp(p.x,s.x0,s.x1),cz=clamp(p.z,s.z0,s.z1),dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
      if(d2>=r*r)continue; hit=true;
      if(d2>1e-8){const d=Math.sqrt(d2),k=(r-d)/d;p.x+=dx*k;p.z+=dz*k;}
      else{const l=p.x-s.x0,rr=s.x1-p.x,t=p.z-s.z0,b=s.z1-p.z,mn=Math.min(l,rr,t,b);
        if(mn===l)p.x=s.x0-r;else if(mn===rr)p.x=s.x1+r;else if(mn===t)p.z=s.z0-r;else p.z=s.z1+r;}
    }
  }
  return hit;
}
function bound(p){const r=Math.hypot(p.x,p.z);if(r>188){p.x*=188/r;p.z*=188/r;return true;}return false;}

/* ---------------- shared materials ---------------- */
const phong=(color,o={})=>new THREE.MeshPhongMaterial(Object.assign({color,shininess:40,specular:0x222222},o));
const lam=(color,o={})=>new THREE.MeshLambertMaterial(Object.assign({color},o));
function mesh(geo,mat,x,y,z,parent,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(shadow){m.castShadow=true;m.receiveShadow=true;}(parent||scene).add(m);return m;}
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);

/* ---------------- farmyard ---------------- */

const A={ctx:null,master:null,eng:null,o1:null,o2:null,filt:null,lfo:null,muted:false};
function initAudio(){
  if(A.ctx)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const ctx=new C();A.ctx=ctx;
    A.master=ctx.createGain();A.master.gain.value=A.muted?0:0.55;A.master.connect(ctx.destination);
    A.eng=ctx.createGain();A.eng.gain.value=0;
    A.filt=ctx.createBiquadFilter();A.filt.type='lowpass';A.filt.frequency.value=520;A.filt.Q.value=2;
    A.o1=ctx.createOscillator();A.o1.type='sawtooth';A.o1.frequency.value=34;
    A.o2=ctx.createOscillator();A.o2.type='square';A.o2.frequency.value=17;
    const g2=ctx.createGain();g2.gain.value=0.35;
    A.o1.connect(A.filt);A.o2.connect(g2);g2.connect(A.filt);
    A.filt.connect(A.eng);A.eng.connect(A.master);
    A.lfo=ctx.createOscillator();A.lfo.frequency.value=8;const lg=ctx.createGain();lg.gain.value=0.05;A.lfo.connect(lg);lg.connect(A.eng.gain);
    A.o1.start();A.o2.start();A.lfo.start();
  }catch(e){A.ctx=null;}
}
function audioTick(engineOn){
  if(!A.ctx)return;const t=A.ctx.currentTime;
  const rpm=1+Math.abs(T.speed)/12*1.5+Math.max(0,Math.abs(T.throttle))*0.45;
  A.o1.frequency.setTargetAtTime(30*rpm,t,0.12);A.o2.frequency.setTargetAtTime(15.2*rpm,t,0.12);
  A.lfo.frequency.setTargetAtTime(7*rpm,t,0.12);
  A.filt.frequency.setTargetAtTime(420+380*Math.abs(T.throttle)+120*rpm,t,0.1);
  A.eng.gain.setTargetAtTime(engineOn?0.16+0.07*Math.abs(T.throttle):0,t,engineOn?0.15:0.35);
}
function honk(){
  if(!A.ctx)return;const t=A.ctx.currentTime,g=A.ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.18,t+0.02);g.gain.setValueAtTime(0.18,t+0.38);g.gain.linearRampToValueAtTime(0,t+0.48);
  const f=A.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;g.connect(f);f.connect(A.master);
  for(const hz of[349,440]){const o=A.ctx.createOscillator();o.type='square';o.frequency.value=hz;o.connect(g);o.start(t);o.stop(t+0.5);}
}
function setMuted(m){A.muted=m;$('sound').textContent=m?'Sound off':'Sound on';if(A.master)A.master.gain.setTargetAtTime(m?0:0.55,A.ctx.currentTime,0.05);}
$('sound').addEventListener('click',()=>{initAudio();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();setMuted(!A.muted);});

function stickMove(e){
  const r=stickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width*0.42;
  let dx=e.clientX-cx,dy=e.clientY-cy;const l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  let x=dx/R,y=-dy/R;const m=Math.hypot(x,y);if(m<0.12){x=0;y=0;}
  stick.x=x;stick.y=y;
}

  if(s!==promptState){promptState=s;const p=$('prompt');p.innerHTML=s;p.hidden=!s;}
  const b=$('bUse');const ready=inTractor?Math.abs(T.speed)<=2.5:nearTractor();b.classList.toggle('ready',ready&&!inTractor);b.classList.toggle('off',!ready);
}

/* ---------------- simulation ---------------- */
function pushBalesFrom(x,z,r,vx,vz,strength){
  for(const b of bales){const dx=b.x-x,dz=b.z-z,m=r+b.r,d=Math.hypot(dx,dz);if(d<m&&d>1e-5){const nx=dx/d,nz=dz/d,o=m-d;b.x+=nx*o;b.z+=nz*o;const along=Math.max(0,vx*nx+vz*nz);b.vx+=nx*along*strength;b.vz+=nz*along*strength;b.spin=(b.spin||0)+(Math.random()-0.5)*along;}}
}
function updateBales(dt){
  for(const b of bales){
    const sp=Math.hypot(b.vx,b.vz);if(sp>12){b.vx*=12/sp;b.vz*=12/sp;}
    b.x+=b.vx*dt;b.z+=b.vz*dt;const f=Math.exp(-2.6*dt);b.vx*=f;b.vz*=f;
    const p={x:b.x,z:b.z};if(resolve(p,b.r)){b.vx*=-0.3;b.vz*=-0.3;}bound(p);b.x=p.x;b.z=p.z;
    b.rot+=(b.spin||0)*dt;b.spin=(b.spin||0)*f;
  }
  for(let i=0;i<bales.length;i++)for(let j=i+1;j<bales.length;j++){const a=bales[i],c=bales[j],dx=c.x-a.x,dz=c.z-a.z,d=Math.hypot(dx,dz),m=a.r+c.r;if(d<m&&d>1e-5){const o=(m-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*o;a.z-=nz*o;c.x+=nx*o;c.z+=nz*o;const rv=(c.vx-a.vx)*nx+(c.vz-a.vz)*nz;if(rv<0){a.vx+=nx*rv*0.5;a.vz+=nz*rv*0.5;c.vx-=nx*rv*0.5;c.vz-=nz*rv*0.5;}}}
  for(const b of bales){b.m.position.set(b.x,heightAt(b.x,b.z)+0.64,b.z);b.m.rotation.y=b.rot;}
}

function updatePlayer(dt){
  const mv=moveInput();
  const run=keys.ShiftLeft||keys.ShiftRight||stick.x*stick.x+stick.y*stick.y>0.88;
  const sp=run?7.2:4.3;
  const s=Math.sin(P.yaw),c=Math.cos(P.yaw);
  const fx=-s,fz=-c,rx=c,rz=-s;
  let vx=(fx*mv.y+rx*mv.x),vz=(fz*mv.y+rz*mv.x);const l=Math.hypot(vx,vz);if(l>1){vx/=l;vz/=l;}
  P.pos.x+=vx*sp*dt;P.pos.z+=vz*sp*dt;
  const p={x:P.pos.x,z:P.pos.z};
  resolve(p,0.4);
  for(let i=0;i<3;i++){const t=tWorld(i);const dx=p.x-t.x,dz=p.z-t.z,m=0.4+t.r,d=Math.hypot(dx,dz);if(d<m&&d>1e-5){p.x+=dx/d*(m-d);p.z+=dz/d*(m-d);}}
  pushBalesFrom(p.x,p.z,0.4,vx*sp,vz*sp,0.35);
  bound(p);P.pos.x=p.x;P.pos.z=p.z;
  const gy=heightAt(P.pos.x,P.pos.z);
  P.vy-=19*dt;P.pos.y+=P.vy*dt;
  if(P.pos.y<=gy){P.pos.y=gy;P.vy=0;P.ground=true;}else if(P.pos.y-gy>0.05)P.ground=false;
  const moving=l>0.1&&P.ground;P.bob+=moving?dt*sp*1.9:0;
  const bob=moving?Math.sin(P.bob)*0.045:0;
  camera.position.set(P.pos.x,P.pos.y+1.7+bob,P.pos.z);
  camera.rotation.set(P.pitch,P.yaw,0);
}

function updateTractor(dt){
  const mv=inTractor?moveInput():{x:0,y:0};
  const brake=inTractor&&keys.Space;
  const thr=mv.y;T.throttle=lerp(T.throttle,thr,Math.min(1,dt*6));
  if(thr!==0){
    if(thr*T.speed>=0)T.speed+=thr*(thr>0?4.2:2.8)*dt;
    else T.speed+=thr*10*dt;
  }else{const d=2.2*dt;T.speed=Math.abs(T.speed)<d?0:T.speed-Math.sign(T.speed)*d;}
  if(brake){const d=14*dt;T.speed=Math.abs(T.speed)<d?0:T.speed-Math.sign(T.speed)*d;}
  T.speed-=T.speed*0.12*dt;
  T.speed-=9.8*Math.sin(T.pitch)*0.32*dt;
  T.speed=clamp(T.speed,-5,12.5);
  if(!inTractor&&Math.abs(T.speed)<0.05)T.speed=0;
  const maxSteer=0.62-0.32*clamp(Math.abs(T.speed)/12,0,1);
  T.steer=lerp(T.steer,mv.x*maxSteer,Math.min(1,dt*(mv.x?4:6)));
  T.yaw-=T.speed/3.1*Math.tan(T.steer)*dt;
  T.pos.x+=Math.sin(T.yaw)*T.speed*dt;T.pos.z+=Math.cos(T.yaw)*T.speed*dt;
  // collisions
  let pushX=0,pushZ=0,hit=false;
  for(let i=0;i<3;i++){const w=tWorld(i);const p={x:w.x,z:w.z};if(resolve(p,w.r)){hit=true;const dx=p.x-w.x,dz=p.z-w.z;if(Math.abs(dx)>Math.abs(pushX))pushX=dx;if(Math.abs(dz)>Math.abs(pushZ))pushZ=dz;}}
  if(hit){T.pos.x+=pushX;T.pos.z+=pushZ;if(Math.abs(T.speed)>3)shake=Math.min(0.35,Math.abs(T.speed)*0.03);T.speed*=Math.exp(-dt*7);}
  {const p={x:T.pos.x,z:T.pos.z};if(bound(p)){T.pos.x=p.x;T.pos.z=p.z;T.speed*=0.9;}}
  const tvx=Math.sin(T.yaw)*T.speed,tvz=Math.cos(T.yaw)*T.speed;
  for(let i=0;i<3;i++){const w=tWorld(i);pushBalesFrom(w.x,w.z,w.r,tvx,tvz,1.0);}
  // keep the player from being driven through
  if(!inTractor){for(let i=0;i<3;i++){const w=tWorld(i);const dx=P.pos.x-w.x,dz=P.pos.z-w.z,m=w.r+0.4,d=Math.hypot(dx,dz);if(d<m&&d>1e-5){P.pos.x+=dx/d*(m-d);P.pos.z+=dz/d*(m-d);}}}
  // sit on the terrain
  const f=tLocalToWorld(0,1.9),r=tLocalToWorld(0,-1.2),L=tLocalToWorld(1.3,0.3),R=tLocalToWorld(-1.3,0.3);
  const hF=heightAt(f.x,f.z),hR=heightAt(r.x,r.z),hL=heightAt(L.x,L.z),hRt=heightAt(R.x,R.z);
  const k=Math.min(1,dt*10);
  T.y=lerp(T.y,(hF+hR+hL+hRt)/4,k);
  T.pitch=lerp(T.pitch,Math.atan2(hF-hR,3.1),k);
  T.roll=lerp(T.roll,Math.atan2(hL-hRt,2.6),k);
  const bump=inTractor&&Math.abs(T.speed)>0.5?Math.sin(performance.now()*0.03)*0.004*Math.abs(T.speed)/12:0;
  tractor.position.set(T.pos.x,T.y+bump,T.pos.z);
  tractor.rotation.set(-T.pitch,T.yaw,T.roll,'YXZ');
  // wheels
  T.rs+=T.speed/0.95*dt;T.fs+=T.speed/0.62*dt;
  for(const w of tw.rear)w.rotation.x=T.rs;
  for(const w of tw.front)w.rotation.x=T.fs;
  for(const p of tw.pivots)p.rotation.y=-T.steer;
  steerWheel.children[0].rotation.z=steerWheel.children[1].rotation.z=T.steer*3.2;
  tractor.updateMatrixWorld(true);
  // cut wheat under the tractor
  if(Math.abs(T.speed)>0.3)cutUnder();
}
let replantAt=0;
function cutUnder(){
  if(T.pos.x<FIELD.x0-5||T.pos.x>FIELD.x1+5||T.pos.z<FIELD.z0-5||T.pos.z>FIELD.z1+5)return;
  const s=Math.sin(T.yaw),c=Math.cos(T.yaw);
  const i0=Math.max(0,Math.floor((T.pos.x-4.6-FX0)/SX)),i1=Math.min(NX-1,Math.ceil((T.pos.x+4.6-FX0)/SX));
  const j0=Math.max(0,Math.floor((T.pos.z-4.6-FZ0)/SZ)),j1=Math.min(NZ-1,Math.ceil((T.pos.z+4.6-FZ0)/SZ));
  let changed=false;
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){
    const k=i*NZ+j;if(cut[k])continue;
    const dx=cropX[k]-T.pos.x,dz=cropZ[k]-T.pos.z,lx=dx*c-dz*s,lz=dx*s+dz*c;
    if(Math.abs(lx)<1.95&&lz>-2.3&&lz<3.6){cut[k]=1;cutCount++;setCrop(k,true);changed=true;if(Math.random()<0.4)emitChaff(cropX[k],cropY[k],cropZ[k]);}
  }
  if(changed){crops.instanceMatrix.needsUpdate=true;if(crops.instanceColor)crops.instanceColor.needsUpdate=true;updateField();
    if(cutCount>=TOTAL&&!replantAt){toast('Whole field cut! Replanting…',3500);replantAt=performance.now()+5000;}}
}
function replant(){cut.fill(0);cutCount=0;for(let k=0;k<TOTAL;k++)setCrop(k,false);crops.instanceMatrix.needsUpdate=true;if(crops.instanceColor)crops.instanceColor.needsUpdate=true;updateField();toast('Fresh wheat is up',1800);}

const _v=new V3(),_e=new THREE.Euler(0,0,0,'YXZ'),_qq=new THREE.Quaternion();
function updateCamera(dt){
  if(!started){
    attract+=dt*0.12;
    camTarget.set(T.pos.x,T.y+1.6,T.pos.z);
    camera.position.set(T.pos.x+Math.cos(attract)*10.5,T.y+3.4,T.pos.z+Math.sin(attract)*10.5);
    camera.lookAt(camTarget);return;
  }
  if(!inTractor)return; // player camera set in updatePlayer
  if(camMode===0){
    if(performance.now()-lastLook>1600&&Math.abs(T.speed)>1){camYaw=wrapA(camYaw);camYaw*=Math.exp(-dt*1.6);}
    const ang=T.yaw+Math.PI+camYaw,dist=11;
    camTarget.set(T.pos.x,T.y+2.1,T.pos.z);
    camDesired.set(camTarget.x+Math.sin(ang)*Math.cos(camPitch)*dist,camTarget.y+Math.sin(camPitch)*dist,camTarget.z+Math.cos(ang)*Math.cos(camPitch)*dist);
    const gmin=heightAt(camDesired.x,camDesired.z)+0.7;if(camDesired.y<gmin)camDesired.y=gmin;
    camera.position.lerp(camDesired,1-Math.exp(-dt*10));
    camera.lookAt(camTarget);
  }else{
    _v.set(0,2.5,-1.08);tractor.localToWorld(_v);camera.position.copy(_v);
    _e.set(cabPitch,Math.PI+cabYaw,0,'YXZ');_qq.setFromEuler(_e);
    camera.quaternion.copy(tractor.quaternion).multiply(_qq);
  }
  if(shake>0){camera.position.x+=(Math.random()-0.5)*shake;camera.position.y+=(Math.random()-0.5)*shake;shake=Math.max(0,shake-dt*1.2);}
}

/* ---------------- loop ---------------- */
let last=performance.now(),smokeAcc=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  updateTractor(dt);
  if(started&&!inTractor)updatePlayer(dt);
  updateBales(dt);
  updateCamera(dt);
  // exhaust: idles when someone is in the cab
  smokeAcc+=dt*(inTractor?3+16*Math.abs(T.throttle):0);
  while(smokeAcc>1){smokeAcc-=1;emitSmoke();}
  updateParticles(dt);
  beacon.material.emissive.setHex(inTractor&&Math.sin(now*0.012)>0.3?0xffaa00:0x443300);
  audioTick(inTractor);
  if(replantAt&&now>replantAt){replantAt=0;replant();}
  if(inTractor)updateGauge();
  updatePrompt();
  const focus=inTractor||!started?tractor.position:P.pos;placeSun(focus);
  window.__sky.position.copy(camera.position);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}

/* ---------------- start screen ---------------- */
$('keys').innerHTML=isTouch
  ?'<h2>Touch controls</h2><div><b>Left stick</b><span>walk or drive</span></div><div><b>Drag right</b><span>look around</span></div><div><b>Get in</b><span>enter or leave the cab</span></div><div><b>Jump · Horn</b><span>on foot · driving</span></div><div><b>View</b><span>chase or cab camera</span></div><div><b>Push hard</b><span>to run</span></div>'
  :'<h2>Keyboard + mouse</h2><div><b>WASD</b><span>walk or drive</span></div><div><b>Mouse</b><span>look around</span></div><div><b>E</b><span>get in · get out</span></div><div><b>Space</b><span>jump · brake</span></div><div><b>Shift</b><span>run</span></div><div><b>C</b><span>chase or cab view</span></div><div><b>H</b><span>horn</span></div><div><b>M</b><span>mute</span></div>';
function begin(){
  if(started)return;started=true;
  initAudio();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();
  $('start').hidden=true;
  $('touch').hidden=!isTouch;$('legend').hidden=isTouch;
  refreshUI();updateLockHint();requestLock();canvas.focus({preventScroll:true});
  if(!inTractor){camera.position.set(P.pos.x,P.pos.y+1.7,P.pos.z);}
  toast('Walk to the tractor',1800);
}
$('go').addEventListener('click',begin);
window.__fieldDay={T,P,get cut(){return cutCount;},get inTractor(){return inTractor;}};
refreshUI();updateField();

/* ---------------- live-update state handoff ---------------- */
const hot=window.claude&&window.claude.hot;
if(hot&&typeof hot.snapshot==='function'){try{hot.snapshot(()=>({T:{x:T.pos.x,z:T.pos.z,yaw:T.yaw},P:{x:P.pos.x,z:P.pos.z,yaw:P.yaw,pitch:P.pitch},inTractor,camMode,started,cut:Array.from(cut).join('')}));}catch(e){}}
function boot(data){
  try{
    if(data&&data.T){T.pos.set(data.T.x,0,data.T.z);T.yaw=data.T.yaw;}
    if(data&&data.P){P.pos.set(data.P.x,heightAt(data.P.x,data.P.z),data.P.z);P.yaw=data.P.yaw;P.pitch=data.P.pitch;}
    if(data&&typeof data.cut==='string'&&data.cut.length===TOTAL){for(let k=0;k<TOTAL;k++){if(data.cut[k]==='1'){cut[k]=1;cutCount++;setCrop(k,true);}}crops.instanceMatrix.needsUpdate=true;if(crops.instanceColor)crops.instanceColor.needsUpdate=true;updateField();}
    if(data&&data.started){begin();if(data.inTractor){inTractor=true;camMode=data.camMode||0;driver.visible=camMode===0;refreshUI();}}
  }catch(e){}
  T.y=heightAt(T.pos.x,T.pos.z);
  requestAnimationFrame(t=>{last=t;frame(t);});
}
if(hot&&typeof hot.ready==='function')hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
