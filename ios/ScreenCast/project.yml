name: ScreenCast
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # >>> Change these three to your own values <<<
    BUNDLE_ID: com.example.screencast
    APP_GROUP_ID: group.com.example.screencast
    DEVELOPMENT_TEAM: ""   # your Apple team ID, or pick it in Xcode > Signing
    CODE_SIGN_STYLE: Automatic
targets:
  ScreenCast:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Screen Cast
        UILaunchScreen: {}
        AppGroupID: $(APP_GROUP_ID)
        NSLocalNetworkUsageDescription: Find TVs on your Wi-Fi and stream your screen to them.
    entitlements:
      path: App/ScreenCast.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: Broadcast
        embed: true
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).broadcast
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Screen Cast
        AppGroupID: $(APP_GROUP_ID)
        NSLocalNetworkUsageDescription: Find TVs on your Wi-Fi and stream your screen to them.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
