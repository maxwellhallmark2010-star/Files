<title>Gearhead Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Barlow:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-bleed 3D shop floor; work order pinned left, part tag right, tool rail along the bottom. */
:root{
  --asphalt:#15171b; --panel:rgba(22,24,29,.88); --panel-2:#22252c; --line:rgba(255,255,255,.12);
  --steel:#d6dbe1; --muted:#8e96a3; --safety:#ffc21a; --orange:#ff6a2b; --good:#3ddc84; --warn:#ffb020; --bad:#ff4d4d; --info:#4cc3ff;
  --display:'Teko','Arial Narrow',Impact,sans-serif; --body:'Barlow','Segoe UI',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--asphalt);color:var(--steel);font-family:var(--body);-webkit-user-select:none;user-select:none}
#view{position:fixed;inset:0}
#view canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font-family:var(--body);cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--safety);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;z-index:4;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#top>*{pointer-events:auto}
.brand{font-family:var(--display);font-size:30px;line-height:.8;letter-spacing:.04em;color:#fff;padding:8px 12px 4px;background:repeating-linear-gradient(-45deg,var(--safety) 0 10px,#1b1b1b 10px 20px);border-radius:6px;position:relative}
.brand span{background:#1b1b1b;padding:2px 8px 0;border-radius:3px;display:inline-block}
.brand span+span{background:var(--safety);color:#1b1b1b;margin-left:4px}
.stats{margin-left:auto;display:flex;gap:6px;align-items:stretch}
.stat{padding:5px 12px 4px;min-width:72px}
.stat b{display:block;font-family:var(--mono);font-size:17px;color:#fff;font-weight:600}
#cash{color:var(--good)}
#rep{color:var(--safety);letter-spacing:.05em}
.tbtn{padding:0 14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--panel);border-radius:10px}
.tbtn:hover{border-color:var(--safety)}

/* work order */
#job{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(76px + env(safe-area-inset-top,0px));width:290px;max-height:calc(100% - 190px);overflow:auto;z-index:3}
#job .hd{padding:12px 14px 10px;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
#job .hd .sw{width:14px;height:14px;border-radius:3px;margin-top:4px;flex:none;border:1px solid rgba(255,255,255,.4)}
#job h3{margin:0;font-family:var(--display);font-weight:500;font-size:24px;line-height:1;color:#fff;letter-spacing:.02em}
#job .who{font-size:13px;color:var(--muted);margin-top:2px}
#job .quote{padding:10px 14px;font-size:14px;line-height:1.45;font-style:italic;color:#e8ecf0;border-bottom:1px dashed var(--line)}
#job .sec{padding:10px 14px}
#findings{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
#findings li{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;border-radius:6px;background:rgba(255,255,255,.04);cursor:pointer}
#findings li:hover{background:rgba(255,255,255,.09)}
#findings .pc{margin-left:auto;font-family:var(--mono);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
#jobHint{font-size:13px;line-height:1.4;color:var(--info);margin-top:8px}
#jobPay{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
#jobPay b{font-family:var(--mono);color:var(--good);font-size:16px}

/* part tag */
#part{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(76px + env(safe-area-inset-top,0px));width:280px;z-index:3;overflow:hidden}
#part .tag{padding:12px 14px;border-bottom:1px dashed var(--line);position:relative}
#part .tag::before{content:"";position:absolute;right:14px;top:14px;width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
#partName{font-family:var(--display);font-size:26px;line-height:1;color:#fff;font-weight:500;margin-top:2px}
#part .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.cond{display:flex;flex-direction:column;gap:4px}
.cond .row{display:flex;justify-content:space-between;font-size:13px}
.meter{height:10px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.meter i{display:block;height:100%;width:0;transition:width .3s}
.meter.unknown i{width:100%!important;background:repeating-linear-gradient(-45deg,#3a3f48 0 6px,#2b2f36 6px 12px)!important}
#partState{font-size:13px;color:var(--muted)}
#partLock{font-size:13px;color:var(--warn);display:flex;gap:6px;align-items:flex-start}
.acts{display:flex;flex-direction:column;gap:6px}
.act{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;font-size:14px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.act:hover:not(:disabled){border-color:var(--safety)}
.act.primary{background:var(--safety);color:#1b1b1b;border-color:var(--safety)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act .num{font-size:13px}
.prog{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--info)}

/* tool rail */
#rail{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;z-index:3;max-width:calc(100% - 32px);overflow-x:auto}
.tool{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:68px;padding:8px 8px 6px;border-radius:8px;border:1px solid transparent;background:transparent;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--steel)}
.tool svg{width:24px;height:24px}
.tool:hover:not(:disabled){background:rgba(255,255,255,.06)}
.tool.on{border-color:var(--safety);color:var(--safety);background:rgba(255,194,26,.08)}
.tool:disabled{opacity:.35;cursor:not-allowed}
.tool.finish{background:var(--good);color:#0e2a19;min-width:96px}
.tool.finish:disabled{background:#2c3a31;color:var(--muted)}
.sep{width:1px;background:var(--line);margin:4px 2px;flex:none}

#hoverTip{position:fixed;pointer-events:none;z-index:6;padding:5px 9px;border-radius:6px;background:#0d0f12;border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap;transform:translate(14px,14px)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:7;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{padding:8px 14px;border-radius:8px;background:#0d0f12;border:1px solid var(--line);font-size:14px;font-weight:600;text-align:center;animation:tIn .25s ease-out}
.toast.good{border-color:var(--good)}.toast.bad{border-color:var(--bad)}.toast.money{border-color:var(--good);color:var(--good);font-family:var(--mono)}
@keyframes tIn{from{transform:translateY(8px);opacity:0}}

/* paint */
#paintBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));padding:12px 14px;z-index:4;width:min(520px,calc(100% - 32px))}
#paintBar .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--safety)}
#paintProg{flex:1;min-width:120px}

/* modals */
.overlay{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(8,9,11,.72);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.sheet{width:100%;max-width:880px;max-height:100%;overflow:auto;border-radius:12px;background:#1b1e24;border:1px solid var(--line)}
.sheet .sh{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sheet h2{margin:0;font-family:var(--display);font-weight:500;font-size:34px;line-height:1;color:#fff;letter-spacing:.02em}
.sheet .sb{padding:16px 20px 20px}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.offer{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel-2);display:flex;flex-direction:column;gap:8px;min-width:0}
.offer h4{margin:0;font-family:var(--display);font-weight:500;font-size:24px;line-height:1;color:#fff}
.offer .q{font-size:14px;line-height:1.4;font-style:italic;flex:1}
.offer .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.offer .meta b{font-family:var(--mono);color:var(--good);font-size:16px}
.chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.08)}
.chip.paint{background:rgba(255,106,43,.18);color:var(--orange)}
.btn{padding:10px 16px;border-radius:8px;border:0;background:var(--safety);color:#1b1b1b;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--steel)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.up{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px}
.up h4{margin:0;font-size:16px;color:#fff}
.up p{margin:0;font-size:13px;line-height:1.4;color:var(--muted);flex:1}
.up .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.receipt{font-family:var(--mono);font-size:14px;max-width:440px;margin:0 auto;background:#f4f1e8;color:#23221f;padding:18px 20px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.receipt .r{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.receipt .r.t{border-top:1px dashed #9a958a;margin-top:6px;padding-top:8px;font-weight:600;font-size:16px}
.receipt .note{font-size:12px;color:#6b665c;padding:2px 0}
.receipt .stars{font-size:22px;color:#c58a00;text-align:center;margin-top:8px;letter-spacing:.1em}
.receipt .say{font-family:var(--body);font-style:italic;text-align:center;font-size:14px;margin-top:4px}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--asphalt);font-family:var(--display);font-size:30px;letter-spacing:.06em;color:var(--safety)}
.intro p{font-size:15px;line-height:1.55;max-width:62ch;margin:0 0 10px}
.intro ol{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.6}

@media (max-width:760px){
  .brand{font-size:22px}.stat{min-width:0;padding:4px 8px}.stat b{font-size:14px}.stat .lbl{font-size:9px}
  #job{width:auto;right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));max-height:34%}
  #job .quote,#job .sec.find{display:none}
  #job.open .quote,#job.open .sec.find{display:block}
  #part{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-height:45%;overflow:auto}
  .tool{min-width:56px;font-size:10px}
  .tbtn{padding:0 9px;font-size:12px}
  #job .hd{cursor:pointer}
  #job .hd::after{content:'▾';margin-left:auto;color:var(--muted)}
  #job.open .hd::after{content:'▴'}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="view"></div>
<div id="loading">Opening the shop…</div>

<header id="top">
  <div class="brand"><span>GEARHEAD</span><span>GARAGE</span></div>
  <div class="stats">
    <div class="stat panel"><div class="lbl">Cash</div><b id="cash" class="num">$0</b></div>
    <div class="stat panel"><div class="lbl">Day</div><b id="day" class="num">1</b></div>
    <div class="stat panel"><div class="lbl">Rating</div><b id="rep">★★★☆☆</b></div>
    <button class="tbtn" id="btnPC">Shop PC</button>
  </div>
</header>

<aside id="job" class="panel" hidden>
  <div class="hd"><span class="sw" id="jobSwatch"></span><div style="min-width:0"><h3 id="jobCar">—</h3><div class="who" id="jobWho">—</div></div></div>
  <div class="quote" id="jobQuote"></div>
  <div class="sec find">
    <div class="lbl">Findings</div>
    <ul id="findings"></ul>
    <div id="jobHint"></div>
  </div>
  <div class="sec" style="border-top:1px dashed var(--line)"><div id="jobPay"><span class="lbl">Quoted labor</span><b id="jobLabor">$0</b></div></div>
</aside>

<aside id="part" class="panel" hidden>
  <div class="tag"><div class="lbl" id="partCat">Part</div><div id="partName">—</div></div>
  <div class="body">
    <div class="cond"><div class="row"><span class="lbl">Condition</span><span id="partPct" class="num">??</span></div><div class="meter" id="partMeter"><i></i></div></div>
    <div id="partState"></div>
    <div id="partLock" hidden></div>
    <div class="prog" id="partProg" hidden><i></i></div>
    <div class="acts" id="partActs"></div>
  </div>
</aside>

<nav id="rail" class="panel" hidden>
  <button class="tool" id="tLift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21V5M20 21V5M4 13h16M8 13l-2-3M16 13l2-3M12 3v6M9 6l3-3 3 3"/></svg>Lift</button>
  <button class="tool" id="tHood"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18l-2-5H8L3 17zM8 12l6-7"/></svg>Hood</button>
  <button class="tool" id="tScan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 9l2 2 2-4 2 6 2-3"/></svg>Scan</button>
  <button class="tool" id="tView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/></svg>Wear map</button>
  <button class="tool" id="tPaint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h9v5H4zM13 10h3l2 2M8 13v4h2v4"/><path d="M19 6v.01M21 9v.01M19 12v.01"/></svg>Paint</button>
  <span class="sep"></span>
  <button class="tool" id="vOver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l2-5h14l2 5v3H3z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Car</button>
  <button class="tool" id="vEngine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h3V7h6v2h3l2 3v5h-3v2H7v-3H5z"/></svg>Engine</button>
  <button class="tool" id="vWheel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Wheel</button>
  <button class="tool" id="vUnder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h18M6 8l1 5h10l1-5M12 13v6M9 16l3 3 3-3"/></svg>Under</button>
  <span class="sep"></span>
  <button class="tool finish" id="tFinish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>Hand back</button>
</nav>

<div id="paintBar" class="panel" hidden>
  <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="lbl">Spray gun · drag across the car</span><span class="num" id="paintCost" style="font-size:12px;color:var(--muted)"></span></div>
  <div class="row" id="swatches"></div>
  <div class="row" style="margin-top:10px">
    <div class="meter" id="paintProg"><i style="background:var(--orange)"></i></div>
    <button class="btn ghost" id="paintSpin" title="Turn the car">⟲ Turn</button>
    <button class="btn" id="paintDone">Done</button>
  </div>
</div>

<div id="hoverTip" hidden></div>
<div id="toasts"></div>
<div id="modal" class="overlay" hidden><div class="sheet" id="sheet"></div></div>

<script type="importmap">

</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ================================================================ basics
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + (b - a) * Math.random();
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const ease = t => t * t * (3 - 2 * t);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const LOW = matchMedia('(pointer: coarse)').matches || innerWidth < 760;
renderer.setPixelRatio(Math.min(devicePixelRatio, LOW ? 1.25 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.82;
$('view').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1c20');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 200);
camera.position.set(5.2, 3.0, 6.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 1.1; controls.maxDistance = 11.5; controls.maxPolarAngle = Math.PI * 0.66;
controls.target.set(0, 0.8, 0);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ================================================================ canvas textures
function canvasTex(w, h, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const x = cv.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const concreteTex = canvasTex(1024, 1024, (x, w, h) => {
  x.fillStyle = '#6f7275'; x.fillRect(0, 0, w, h);

  g.rotateY(-Math.PI / 2); g.translate((width - bevel * 2) / 2, 0, 0); g.computeVertexNormals(); return g;
}

  const C = { job, m, k, root, car, paint, plate: job.plate, parts: {}, bodyMeshes: [], paintMats: [paint], hoodOpen: 0, hoodTarget: 0 };
  const body = (geo, mat = paint) => { const me = new THREE.Mesh(geo, mat); me.castShadow = me.receiveShadow = true; car.add(me); if (mat === paint) C.bodyMeshes.push(me); me.userData.pick = { type: 'body' }; return me; };
  // lower body with wheel arches
  const ar = k.wr + 0.07, zR = -k.wb / 2, zF = k.wb / 2;
  const s = new THREE.Shape();
  s.moveTo(k.rear + 0.12, k.b); s.lineTo(zR - ar, k.b); s.absarc(zR, k.wr, ar, Math.PI, 0, true); s.lineTo(zF - ar, k.b); s.absarc(zF, k.wr, ar, Math.PI, 0, true);
  s.lineTo(k.front - 0.12, k.b); s.quadraticCurveTo(k.front, k.b, k.front, k.b + 0.12); s.lineTo(k.front, k.ft); s.lineTo(k.fw, k.ft); s.lineTo(k.fw, k.belt);

  busy = true; selected = null; renderPanel(); lift.target = 0; C.hoodTarget = 0; wearView = false;
  await waitUntil(() => lift.y < 0.01 && C.hoodOpen < 0.01);
  flyCam(new V3(4.8, 2.2, 8.5), new V3(0, 0.8, 4), 1.0);
  await tween(1.4, p => setDoor(ease(p)));
  startLoop('engine', () => humLoop(64, 'sawtooth', 0.09, 420));
  let last = 0; await tween(3, (p, e) => { const z = lerp(0, 18, e * e); spinWheels(last - z); last = z; C.root.position.z = z; });
  stopLoop('engine'); scene.remove(C.root); C = null; junk.forEach(j => scene.remove(j)); junk.length = 0;
  await tween(1.4, p => setDoor(1 - ease(p)));

  showJobBoard();
}
function waitUntil(fn) { return new Promise(res => { const t = setInterval(() => { if (fn()) { clearInterval(t); res(); } }, 50); }); }

// ---- shop PC
function openPC() {
  openModal(`<div class="sh"><h2>Shop PC</h2><span class="lbl">Upgrades · ${money(state.cash)} available</span><button class="btn ghost" id="pcClose" style="margin-left:auto">Close</button></div><div class="sb">
  <div class="ups">${UPGRADES.map(u => `<div class="up"><h4>${u.name}</h4><p>${u.desc}</p><div class="row"><span class="num" style="color:var(--good)">${money(u.price)}</span>${state.ups[u.id] ? '<span class="chip" style="color:var(--good)">Owned</span>' : `<button class="btn" data-u="${u.id}" ${state.cash < u.price ? 'disabled' : ''}>Buy</button>`}</div></div>`).join('')}</div>
  <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;font-size:14px;color:var(--muted)"><span>Jobs done: <b class="num" style="color:#fff">${state.jobsDone}</b></span><span>Total earned: <b class="num" style="color:#fff">${money(state.earned)}</b></span><button class="btn ghost" id="pcReset" style="margin-left:auto;font-size:13px;padding:6px 10px">Start a new shop</button></div></div>`);
  $('pcClose').onclick = () => { closeModal(); if (!C && !busy) showJobBoard(); };
  $('sheet').querySelectorAll('[data-u]').forEach(b => b.onclick = () => { const u = UPGRADES.find(x => x.id === b.dataset.u); if (state.cash < u.price) return; state.cash -= u.price; state.ups[u.id] = true; save(); updateTop(); SFX.cash(); toast(`${u.name} installed.`, 'good'); applyUpgrades(); openPC(); });
  $('pcReset').onclick = () => { if ($('pcReset').dataset.sure) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); } else { $('pcReset').dataset.sure = 1; $('pcReset').textContent = 'Click again to wipe your progress'; } };
}
let boombox = null;
function applyUpgrades() {
  neon.material.color.set(state.ups.neon ? '#ffffff' : '#6b6b6b'); neonLight.intensity = state.ups.neon ? 6 : 0;
  if (state.ups.radio && !boombox) { boombox = new THREE.Group(); boombox.position.set(5.6, 0.96, -8.3); props.add(boombox); addBox(0.5, 0.26, 0.16, std('#2a2d33'), 0, 0.13, 0, boombox, 0.03); for (const sx of [-1, 1]) { const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.02, 20), MAT.chrome); sp.rotation.x = Math.PI / 2; sp.position.set(sx * 0.14, 0.12, 0.085); boombox.add(sp); } const h = addBox(0.36, 0.03, 0.03, MAT.chrome, 0, 0.3, 0, boombox, 0.01); setRadio(true); }
  updateRail();

// ================================================================ main loop
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  updateTweens(dt);
  // lift motion
  if (Math.abs(lift.y - lift.target) > 0.001) { const s = Math.sign(lift.target - lift.y); lift.y = clamp(lift.y + s * dt * 0.7, Math.min(lift.y, lift.target), Math.max(lift.y, lift.target)); startLoop('lift', () => humLoop(46, 'square', 0.05, 220)); if (Math.abs(lift.y - lift.target) < 0.001) { stopLoop('lift'); SFX.clunk(); renderPanel(); renderJob(); } }
  lift.carriage.forEach(c => c.position.y = lift.y);
  if (C) {
    C.root.position.y = lift.y;
    C.hoodOpen = clamp(C.hoodOpen + Math.sign(C.hoodTarget - C.hoodOpen) * dt * 1.6, 0, 1); if (Math.abs(C.hoodOpen - C.hoodTarget) < dt * 1.6) { if (C.hoodOpen !== C.hoodTarget) { C.hoodOpen = C.hoodTarget; renderPanel(); } }
    C.hoodPivot.rotation.x = -ease(C.hoodOpen) * 1.15;
  }
  if (paintMode && spraying && C) { const pk = pickAt(spraying.x, spraying.y); if (pk && (pk.type === 'body' || pk.type === 'hood' || (pk.type === 'part' && pk.part.def.paint))) sprayAt(pk.hit, dt); }
  if (state.ups.neon) { const f = Math.random() < 0.01 ? 0.3 : 1; neonLight.intensity = 6 * f; neon.material.color.setScalar(f); }
  controls.update();
  camera.position.y = Math.max(camera.position.y, 0.22); camera.position.x = clamp(camera.position.x, -10.4, 10.4); camera.position.z = clamp(camera.position.z, -8.5, doorOpen > 0.5 ? 14 : 8.6); camera.position.y = Math.min(camera.position.y, GH - 0.5);
  updateHover(); updateHighlights(t); updateParticles(dt);
  renderer.render(scene, camera);
}
updateTop(); applyUpgrades();
$('loading').hidden = true;
loop();
showJobBoard();
</script>
